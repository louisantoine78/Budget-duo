<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123F38"><title>Trace</title><style>html,body{margin:0;background:#f7f5ef}</style></head>
<body>
<script>
(async function(){
  try{
    const r=await fetch('./trace-version.json?ts='+Date.now(),{cache:'no-store'});
    const v=await r.json();
    const u=new URL('./'+v.entry,location.href);
    u.searchParams.set('launch',Date.now().toString());
    location.replace(u.toString());
  }catch(_){
    location.replace('./trace-5.4.0.html?launch='+Date.now());
  }
})();
</script>
</body>
</html>
