name: TRACE 2.0.1 Patrimoine Investments release qualification
on:
  push:
    branches:
      - release/trace-2.0.1-patrimoine-investissements
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  investments201:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check of release code
        run: |
          node --check trace-wealth-201-engine.js
          node --check trace-wealth-201.js
          node --check v5-app-5.37.0.js
          node --check sw.js
      - name: TRACE 2.0.1 accounting, usability and preservation
        run: node --test tests/trace-201-investments.test.cjs
      - name: Existing TRACE banking and foreign exchange regression
        run: |
          node --test tests/trace-international-bank-investment.test.cjs
          node --test tests/trace-cas-investment-ownership-static.test.cjs
      - name: Ensure only authorized Patrimoine and version files changed
        run: |
          set -eu
          git fetch origin main
          for file in config.js sw.js manifest.webmanifest vercel.json;
          do
            git diff --exit-code origin/main HEAD -- "$file"
          done
          changed="$(git diff --name-only origin/main HEAD)"
          echo "$changed"
          if echo "$changed" | grep -Ev '^(trace-wealth-201-engine.js$|trace-wealth-201.js$|trace-wealth-201.css$|index.html$|v5-app-5.37.0.js$|trace-version.json$|tests/trace-201-investments.test.cjs$|tests/trace-password-recovery.test.cjs$|tests/trace-international-preview-boot.test.cjs$|\.github/workflows/trace-201-qualification.yml$|docs/TRACE-2.0.1-PATRIMOINE-RELEASE.md$|docs/TRACE-2.0.2-MULTIDEVISE-ET-COURS.md$|experiments/trace-201-analytics-demo.html$|scripts/trace-202-mobile-webkit-qa.cjs$)' | grep -q .; then
            echo 'Unexpected file outside TRACE 2.0.1 scope.'
            exit 1
          fi

  mobile-webkit:
    # Isolated demo only. No production credentials, Supabase, or network calls.
    # WebKit Playwright 1.56 is tested on noble, not Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned WebKit browser and test dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps webkit
      - name: Validate iPhone-sized layouts using WebKit (fictional data, no HTTP egress)
        env:
          TRACE_MOBILE_SCREENSHOTS: '1'
        run: node scripts/trace-202-mobile-webkit-qa.cjs
