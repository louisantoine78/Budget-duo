name: TRACE regression safeguards
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check active JavaScript syntax
        run: |
          node --check v5-app-5.36.1.js
          node --check trace-movement-5.36.0.js
          node --check trace-import-guide-1.2.0.js
          node --check trace-operation-ui-1.0.0.js
          node --check trace-smart-inbox-3.4.0.js
          node --check trace-insights-1.0.0.js
          node --check trace-bank-ui-2.8.1.js
          node --check sw.js
      - name: Run isolated accounting regressions
        run: |
          node tests/trace-regression.test.cjs
          node tests/trace-ledger-scenarios.test.cjs
          node tests/trace-ui-smoke.test.cjs
